services:
  - type: web
    name: lineproj-v4
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: TIMEZONE
        value: Asia/Taipei
      - key: TEST_MODE
        value: "false"
      - key: REALTIME_SHEET_SYNC
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lineproj-v4-db
          property: connectionString

databases:
  - name: lineproj-v4-db
    region: singapore
